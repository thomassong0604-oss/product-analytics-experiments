name: tests

# The whole pipeline runs with no network and no credentials: DuckDB is a file, dbt runs against it,
# and the data is generated. So a green badge means the warehouse builds, its data tests pass, and
# the estimators still hold their nominal error rates — not merely that the imports work.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: End-to-end pipeline
        run: ./scripts/run_all.sh --quick

      - name: Check the pipeline produced its artefacts
        run: |
          test -s results/validation.md
          test -s results/readout.json
          test -s docs/index.html
          grep -q "false positive rate" results/validation.md
          grep -q "honesty ratio" results/validation.md

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: pipeline-output
          path: |
            results/
            docs/index.html
