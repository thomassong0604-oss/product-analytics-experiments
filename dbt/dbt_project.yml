name: pae
version: "0.1.0"
config-version: 2
profile: pae
model-paths: ["models"]
# target-path and log-path are set by DBT_TARGET_PATH / DBT_LOG_PATH in scripts/run_dbt.sh:
# configuring them here is deprecated in dbt 1.12 and emits a warning on every build.
clean-targets: ["../data/dbt_target", "../data/dbt_logs"]

models:
  pae:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
